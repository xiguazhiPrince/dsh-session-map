# The layer this bundle contributes. A profile that lists this bundle in
# dsh.profile.bundles applies it after every earlier layer.
- insert:
    # The canvas row. It names this package, so the Loader imports its node half
    # (lib/index.js) and the modules half reads the same manifest's dsh.client
    # declaration to add lib/client.js to the browser roster.
    - id: session-map
      name: dsh-session-map

    # The ACP subagent backend. The component is vendor-neutral and ONE row
    # carries every agent: `agents` is a list, and the backend derives one
    # subagent provider plus one delegation tool PER agent from it (the tool
    # rows are mounted at runtime — see src/acp/mount.ts — so they are not
    # written here).
    #
    # This row is off by default: a disabled row is never imported, so
    # installing this bundle for the canvas costs no agent code at all. Turn it
    # on in Settings → Plugins, then configure agents in Settings → ACP agents
    # (the shipped settings card) — no YAML editing needed.
    #
    # The subpath specifier is deliberate. Browser client discovery recognizes
    # only a bare package specifier, so a second row of this same package cannot
    # add entries to the boot graph.
    - id: subagent-acp
      name: dsh-session-map/acp
      disabled: true
      config:
        # Empty by default: agents are configured from the settings card, which
        # is what makes this row the ONLY place a deployment has to touch.
        agents: []
