# The layer this bundle contributes. A profile that lists this bundle in
# dsh.profile.bundles applies it after every earlier layer.
- insert:
    # The canvas row. It names this package, so the Loader imports its node half
    # (lib/index.js) and the modules half reads the same manifest's dsh.client
    # declaration to add lib/client.js to the browser roster.
    - id: session-map
      name: dsh-session-map

    # The ACP session route: one `acp` model provider whose models ARE the
    # configured agents, so a remote ACP CLI agent can back a whole Session and
    # the shipped Chat UI renders its traffic unchanged. ONE row carries every
    # agent — `agents` is a list — and each entry also gets a preset card in the
    # new-task picker.
    #
    # ON by default, with an EMPTY agent list, which is what makes the settings
    # page (Settings → ACP) able to write into this row: the settings service
    # only serves an entry that is active. An empty list registers nothing at
    # all — no adapter, no mirrored tool, no preset card — so this default runs
    # no agent code: the switch that matters is whether `agents` has an entry.
    # An enabled agent does run agent code that can write in the session's
    # working directory, and DSH's sandbox does not apply to the remote agent's
    # own process (`fs: bridge` is what brings the remote agent's file access
    # back under this Session's sandbox).
    #
    # The subpath specifier is deliberate. Browser client discovery recognizes
    # only a bare package specifier, so a second row of this same package cannot
    # add entries to the boot graph.
    #
    # Registered at ROOT scope on purpose. `ctx.llm.registerAdapter` binds its
    # effect to the `llm` service rather than to this row, so mounting it inside
    # an agent preset would leak a service and be rejected by the preset audit.
    - id: acp-agent
      name: dsh-session-map/acp-agent
      config:
        # The agent list. Settings → ACP edits exactly this field; a patch author
        # writes the same list by hand.
        agents: []
